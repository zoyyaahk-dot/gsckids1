<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Parent Signup | Global Kids</title><link rel="stylesheet" href="../style.css"><script src="../js/site.js"></script></head><body><main class="parent-auth-page"><div class="parent-auth-card"><div class="parent-auth-brand"><img src="../image/logo.jpeg.jpeg" alt="Global Kids"><h1>Create Parent Account</h1><p>Link your account using the child's admission number.</p></div><form class="parent-form" onsubmit="signupParent(event)"><label>Full Name<input id="name" required></label><label>Email<input id="email" type="email" required></label><label>Phone<input id="phone" required></label><label>Child Admission Number<input id="admission" required></label><label>Password<input id="password" type="password" minlength="6" required></label><button class="parent-primary-btn">Create Account</button></form><div class="parent-auth-links"><a href="login.html">Already have an account?</a><a href="../login.html">Back to portal</a></div><div id="msg" style="margin-top:14px;color:#8a425f;font-size:13px"></div></div></main><script>function signupParent(e){e.preventDefault();const students=JSON.parse(localStorage.getItem('globalKidsStudents')||localStorage.getItem('globalKids_students')||'[]');const child=students.find(x=>String(x.admissionNumber||x.admission_number||'').toLowerCase()===admission.value.trim().toLowerCase());if(!child){msg.textContent='Admission number not found. Ask the school to add/link the student first.';return}const a=JSON.parse(localStorage.getItem('globalKidsParentAccounts')||'[]');if(a.some(x=>x.email===email.value)){msg.textContent='An account already exists for this email.';return}a.push({name:name.value,email:email.value,phone:phone.value,password:password.value,childId:child.id||child.admissionNumber||child.admission_number});localStorage.setItem('globalKidsParentAccounts',JSON.stringify(a));localStorage.setItem('globalKidsParentProfile',JSON.stringify({fullName:name.value,email:email.value,phone:phone.value}));msg.textContent='Account created. Redirecting to login...';setTimeout(()=>location.href='login.html',700);}</script></body></html>
