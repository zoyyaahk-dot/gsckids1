<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Parent Login | Global Kids</title><link rel="stylesheet" href="../style.css"><script src="../js/site.js"></script></head><body><main class="parent-auth-page"><div class="parent-auth-card"><div class="parent-auth-brand"><img src="../image/logo.jpeg.jpeg" alt="Global Kids"><h1>Parent Login</h1><p>Global Kids Parent Portal</p></div><form class="parent-form" onsubmit="loginParent(event)"><label>Email<input id="email" type="email" required></label><label>Password<input id="password" type="password" required></label><button class="parent-primary-btn">Login</button></form><div class="parent-auth-links"><a href="signup.html">Create account</a><a href="../login.html">Back to portal</a></div><div id="msg" style="margin-top:14px;color:#8a425f;font-size:13px"></div></div></main><script>function loginParent(e){e.preventDefault();const a=JSON.parse(localStorage.getItem('globalKidsParentAccounts')||'[]');const u=a.find(x=>x.email===email.value&&x.password===password.value);if(!u){msg.textContent='Invalid parent login details.';return}localStorage.setItem('globalKidsParentSession',JSON.stringify({email:u.email,childId:u.childId||''}));location.href='dashboard.html';}</script></body></html>
